[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/data/logs/supervisord.log
logfile_maxbytes=5MB
logfile_backups=2
pidfile=/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; ---------------------------------------------------------------- 管理面板（常驻）
[program:manager]
command=/opt/manager/venv/bin/python -m uvicorn app:app --app-dir /opt/manager --host 0.0.0.0 --port %(ENV_WEB_PORT)s --proxy-headers
directory=/opt/manager
autostart=true
autorestart=true
priority=1
stdout_logfile=/data/logs/manager.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true

; ---------------------------------------------------------------- 转发服务（由管理面板启停）
[program:bridge]
command=/opt/scripts/run-bridge.sh
directory=/data/bridge
autostart=false
autorestart=true
startsecs=10
startretries=5
stopwaitsecs=20
stopasgroup=true
killasgroup=true
priority=50
stdout_logfile=/data/logs/bridge.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true

; ---------------------------------------------------------------- 安卓（按需启动）
[program:xvfb]
command=Xvfb %(ENV_DISPLAY)s -screen 0 %(ENV_SCREEN_GEOMETRY)s -nolisten tcp -ac
autostart=false
autorestart=true
priority=10
stdout_logfile=/data/logs/vnc.log
redirect_stderr=true

[program:vnc]
command=bash -c 'for i in $(seq 1 30); do [ -S /tmp/.X11-unix/X${DISPLAY#:} ] && break; sleep 1; done; exec x11vnc -display %(ENV_DISPLAY)s -rfbport %(ENV_VNC_PORT)s -localhost -nopw -forever -shared -noxdamage -xkb -quiet'
autostart=false
autorestart=true
startretries=20
priority=20
stdout_logfile=/data/logs/vnc.log
redirect_stderr=true

[program:emulator]
command=/opt/scripts/start-emulator.sh
autostart=false
autorestart=false
startsecs=5
stopsignal=INT
stopwaitsecs=60
killasgroup=true
stopasgroup=true
priority=30
stdout_logfile=/data/logs/emulator.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true

[group:android]
programs=xvfb,vnc,emulator
